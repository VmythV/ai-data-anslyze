[project]
name = "data-analyze"
version = "0.1.0"
description = "AI 数据分析平台后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "claude-agent-sdk==0.2.145",
    "clickhouse-connect[async]>=1.11.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=1.20",
    "openai-codex==0.163.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlglot>=30.25.0",
    "sse-starlette>=3.6.0",
    "trino>=0.340.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
data-analyze = "data_analyze:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 提示词是长段中文，按行折断会改变给模型的文本
"src/data_analyze/engine/prompts.py" = ["E501"]
# 假模型剧本里是整段 SQL，按行折断反而难读
"tests/fake_anthropic.py" = ["E501"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
